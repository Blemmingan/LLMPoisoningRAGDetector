# Ablation study: each variant overrides settings (the CF_* variables, lowercase, no prefix).
# `base` is the default configuration (rag_avanzado: rewriting + hybrid + reranking).
# `compare_to` = variant its differences are taken against (default: base).
# `requires_llm: true` = the variant only changes what the analyst LLM does; with
# --retrieval-only it is skipped (its retrieval would be identical to its reference).
variants:
  - name: base
    description: Configuración por defecto (rag_avanzado - reescritura + híbrida + reranker)
    question: Último paso de la cadena incremental (+ reranker)
    # its row shows the reranker's contribution; the LLM variants compare against base
    compare_to: hibrido_reescritura
    overrides: {}

  # ---- Incremental chain of the retriever (consigna: cambios incrementales) ----
  - name: retriever_basico
    description: Solo búsqueda por embeddings (sin Advanced RAG)
    question: Punto de partida de la cadena incremental
    compare_to: retriever_basico
    overrides: &basico
      query_rewrite: false
      hybrid_search: false
      rerank: false

  - name: hibrido
    description: Básico + búsqueda híbrida BM25 con Reciprocal Rank Fusion
    question: ¿Las palabras literales de los ataques mejoran la búsqueda?
    compare_to: retriever_basico
    overrides:
      query_rewrite: false
      hybrid_search: true
      rerank: false

  - name: hibrido_reescritura
    description: Híbrida + reescritura determinística (oraciones sospechosas)
    question: ¿Enfocar la consulta reduce la dilución del ataque?
    compare_to: hibrido
    overrides:
      query_rewrite: true
      hybrid_search: true
      rerank: false
  # the next step of the chain is `base` (+ reranker)

  # ---- Each technique alone, against the basic retriever ----
  - name: rerank
    description: Básico + solo reranker
    question: ¿El reranker solo sube el ejemplo del tipo correcto?
    compare_to: retriever_basico
    overrides:
      query_rewrite: false
      hybrid_search: false
      rerank: true

  - name: reescritura
    description: Básico + solo reescritura
    question: ¿La reescritura sola ayuda?
    compare_to: retriever_basico
    overrides:
      query_rewrite: true
      hybrid_search: false
      rerank: false

  # ---- Preprocessing and chunking (measured on the basic retriever) ----
  - name: sin_normalizacion
    description: Básico, buscando con el texto crudo en vez de la vista normalizada
    question: ¿Sirve la normalización defensiva para los ataques disfrazados?
    compare_to: retriever_basico
    overrides:
      <<: *basico
      normalize_for_retrieval: false

  - name: chunks_grandes
    description: Básico con chunks de 1000 caracteres y overlap 200 (base 500/100)
    question: ¿El ataque se diluye en chunks más grandes?
    compare_to: retriever_basico
    overrides:
      <<: *basico
      chunk_size: 1000
      chunk_overlap: 200

  # ---- Analyst (need the real LLM), against base ----
  - name: sin_ejemplos
    description: Sin RAG de ataques conocidos (top_k = 0); el LLM decide solo con la literatura
    question: ¿El RAG de ejemplos mejora al LLM solo?
    requires_llm: true
    overrides:
      top_k: 0

  - name: sin_literatura
    description: Sin el segundo retrieval de literatura (literature_top_k = 0)
    question: ¿Aporta la literatura al analista?
    requires_llm: true
    overrides:
      literature_top_k: 0

  - name: sin_verificador
    description: Sin descuento de confianza ni exigencia de fragmento verificado
    question: ¿Cuánta precisión aporta el control anti-alucinación?
    requires_llm: true
    # same prompts as the base: answered from the LLM cache at no cost
    overrides:
      verifier_penalize: false
      verdict_require_verified: false

  - name: prompt_sin_hard_negatives
    description: Prompt sin la política ni los ejemplos de hard negatives
    question: ¿Los ejemplos bajan los falsos positivos en textos que hablan de ataques?
    requires_llm: true
    overrides:
      analyst_prompt: analyst_prompt_sin_hard_negatives
