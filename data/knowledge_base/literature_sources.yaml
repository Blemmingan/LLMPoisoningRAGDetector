# Literature sources for the `literatura` collection of the knowledge base.
#
# Only this list is versioned. The documents themselves are downloaded locally with
# `corpus-forensics lit download` and are NOT committed: the repository is public and most
# of these works can be read but not redistributed (see `licencia` / `clase_licencia`).
#
# clase_licencia: R = redistributable (CC BY / CC BY-SA / public domain)
#                 R-NC = CC BY-NC (non-commercial)
#                 D = download and read locally only (arXiv non-exclusive, blogs, no license shown)
#                 I = internal use only (Unicode technical reports)
# cubre: inyeccion, indirecta, envenenamiento, trigger, jailbreak, exfiltracion,
#        prompt_leaking, ocultamiento, mitigacion
# Curated on 2026-10-31 from the research report "Literatura sobre ataques a LLMs".

