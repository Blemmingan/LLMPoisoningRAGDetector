[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "corpus-forensics"
version = "0.1.0"
description = "Corpus Poisoning Forensic Analyst (RAG-based)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [
    { name = "Forensics Team" }
]
dependencies = [
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "typer>=0.12.0",
    "chromadb>=0.4.22",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pypdf>=4.0.0",
    "pypdfium2>=4.0",
    "streamlit>=1.38",
    "rich>=13.0.0",
    "openai>=1.99",
    "pyarrow>=15",
    "pyyaml>=6",
    "httpx>=0.27",
    "docling>=2.0",
    "tiktoken>=0.7",
    "torch>=2.2",
    "torchvision>=0.17",
    "sentence-transformers>=3.0",
]

[project.scripts]
corpus-forensics = "corpus_forensics.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-pyyaml>=6.0.12.20261030",
]

[tool.hatch.build.targets.wheel]
packages = ["src/corpus_forensics"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "chromadb.*",
    "pypdf.*",
    "pypdfium2.*",
    "bs4.*",
    "lxml.*",
    "pyarrow.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# CPU-only PyTorch on Linux (Docling's layout models do not need CUDA); macOS wheels are
# CPU/MPS already. Avoids downloading several GB of NVIDIA libraries.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
